<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>育てる地図 | 3D体験プロトタイプ</title>
  </head>
  <body>
    <main id="app">
      <div id="map" aria-label="育っていく街の3D地図"></div>
      <div class="map-wash" aria-hidden="true"></div>
      <div id="character-marker" aria-hidden="true"><canvas id="model-canvas"></canvas></div>

      <header class="hero">
        <div class="mode-label"><span></span>探索モード</div>
        <h1>どこへ行こう？</h1>
        <p>今日の気分から、あなたにぴったりの<br>まち歩きを見つけます。</p>
      </header>

      <div class="region-control">
        <label for="region-select">まち</label>
        <select id="region-select" aria-label="表示するまち">
          <option value="nagoya" selected>名古屋・栄</option>
          <option value="shinjuku">東京・新宿</option>
          <option value="tokyo">東京駅・丸の内</option>
          <option value="yokohama">横浜・山下公園</option>
          <option value="minatomirai">横浜・みなとみらい</option>
          <option value="hakone">箱根・芦ノ湖</option>
          <option value="osaka">大阪・道頓堀</option>
        </select>
      </div>

      <div class="map-actions" aria-label="地図表示の操作">
        <button id="animation-toggle" class="map-action" type="button" aria-label="歩行を停止">Ⅱ</button>
        <button id="icon-placement-toggle" class="map-action" type="button" aria-label="建物にアイコンを追加" aria-pressed="false">✦</button>
        <button id="locate-button" class="map-action locate" type="button" aria-label="現在地へ移動">◎</button>
        <span class="view-badge">3D</span>
      </div>

      <section class="plan-sheet" aria-label="AIによるまち歩き提案">
        <p class="sheet-kicker">✦ AIがあなただけのルートを提案</p>
        <h2>どんな一日を過ごしたいですか？</h2>
        <div class="prompt-row">
          <span class="prompt-icon">○</span>
          <span class="prompt-placeholder">例：緑の多いカフェでのんびりしたい</span>
          <button type="button" aria-label="希望を送信">↗</button>
        </div>
        <div class="mood-chips" aria-label="気分を選択">
          <button type="button" class="selected">☼&nbsp; のんびり</button>
          <button type="button">♨&nbsp; グルメ</button>
          <button type="button">▱&nbsp; カフェ</button>
          <button type="button">◇&nbsp; 写真・絶景</button>
        </div>
        <div class="growth-summary">
          <span class="growth-mark">◌</span>
          <span><strong>きょうの地図</strong><small id="status" aria-live="polite">街と人物を読み込んでいます…</small></span>
          <span id="coverage" class="growth-count"></span>
        </div>
        <p id="render-mode" class="render-mode">描画設定を確認しています…</p>
      </section>

      <nav class="bottom-nav" aria-label="ホームナビゲーション">
        <button class="active" type="button"><span>⌑</span>地図を育てる</button>
        <button type="button"><span>✧</span>アプリを育てる</button>
        <button type="button"><span>⌂</span>ホーム</button>
        <button type="button"><span>♧</span>つながる</button>
      </nav>

      <section id="token-help" class="token-help" hidden>
        <h2>公開アクセストークンが必要です</h2>
        <p><code>.env.local</code> に <code>VITE_MAPBOX_ACCESS_TOKEN</code> を設定して再起動してください。</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
