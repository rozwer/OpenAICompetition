components:
  parameters:
    NamespaceId:
      name: X-Namespace-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  schemas:
    Id:
      type: string
      pattern: ^[a-z][a-z0-9]*_[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
      maxLength: 80
    Timestamp: *id001
    SourceMode:
      type: string
      enum:
      - live
      - user
      - sample
      - imported
    ExecutionMode:
      type: string
      enum:
      - live-codex
      - rules
      - manual
      - replay
    Provenance:
      type: object
      properties:
        sourceMode:
          $ref: '#/components/schemas/SourceMode'
        sourceIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        executionMode:
          $ref: '#/components/schemas/ExecutionMode'
        retrievedAt:
          anyOf:
          - *id001
          - type: 'null'
        validUntil:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - sourceMode
      - sourceIds
      - executionMode
      - retrievedAt
      - validUntil
      additionalProperties: false
    LngLat:
      type: object
      properties:
        longitude:
          type: number
          minimum: -180
          maximum: 180
        latitude:
          type: number
          minimum: -90
          maximum: 90
      required:
      - longitude
      - latitude
      additionalProperties: false
    Position:
      type: array
      prefixItems:
      - type: number
        minimum: -180
        maximum: 180
      - type: number
        minimum: -90
        maximum: 90
      minItems: 2
      maxItems: 2
      items: false
    LineString:
      type: object
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          minItems: 2
      required:
      - type
      - coordinates
      additionalProperties: false
    Polygon:
      type: object
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Position'
            minItems: 4
          minItems: 1
      required:
      - type
      - coordinates
      additionalProperties: false
    Context:
      type: object
      properties:
        weather:
          anyOf:
          - type: string
            enum:
            - clear
            - rain
            - snow
            - other
          - type: 'null'
        companion:
          anyOf:
          - type: string
            enum:
            - alone
            - friend
            - family
            - colleague
            - other
          - type: 'null'
        timeBudgetMinutes:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        timeBand:
          anyOf:
          - type: string
            enum:
            - morning
            - day
            - evening
            - night
          - type: 'null'
        notes:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
      required:
      - weather
      - companion
      - timeBudgetMinutes
      - timeBand
      - notes
      additionalProperties: false
    TimeRange:
      type: object
      properties:
        startAt:
          anyOf:
          - *id001
          - type: 'null'
        endAt:
          anyOf:
          - *id001
          - type: 'null'
        precision:
          type: string
          enum:
          - exact
          - approximate
          - unknown
        label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
        timeZone:
          type: string
          maxLength: 80
      required:
      - startAt
      - endAt
      - precision
      - label
      - timeZone
      additionalProperties: false
    KnownBool:
